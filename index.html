<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Magic Weather</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="title">Magic Weather</h1>
      <p class="subtitle">Казковий прогноз погоди для вашого міста</p>
    </header>
      <section class="jquery-demo-section">
        <h2>jQuery демо</h2>

        <button id="toggle-info-btn">Показати / сховати підказку</button>
        <div id="info-box" class="info-box">
          Це коробочка для демо jQuery: її можна показувати/ховати, змінювати стиль,
          анімовувати тощо.
        </div>

        <div class="jquery-demo-buttons">
          <button id="highlight-cards-btn">Підсвітити картки погоди</button>
          <button id="animate-title-btn">Анімувати заголовок</button>
        </div>
      </section>

    <main class="main">
      <section class="search-section">
        <form id="city-form">
          <label for="city-input">Введіть назву міста:</label>
          <input
            type="text"
            id="city-input"
            placeholder="Наприклад: Шостка"
            required
          />
          <button type="submit">Показати погоду</button>
        </form>
        <p id="status-message" class="status-message"></p>
      </section>

      <section class="cards-section">
        <h2>Прогноз погоди</h2>
        <div id="weather-cards" class="cards-container">
          <!-- Сюди будемо додавати картки з погодою -->
        </div>
      </section>
    </main>

    <script type="module" src="/main.js"></script>
  </body>
</html>
